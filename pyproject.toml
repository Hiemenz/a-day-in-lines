[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-day-in-lines"
version = "1.0.0"
description = "An e-ink picture that draws itself over a day"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=9.4",
    "scikit-image>=0.20",
]

[project.optional-dependencies]
slack = ["slack_bolt>=1.18"]
heic = ["pillow-heif>=0.13"]
inky = ["inky>=1.5"]
dev = ["pytest>=7"]

[project.scripts]
a-day-in-lines = "day_in_lines.cli:main"

[tool.setuptools]
packages = ["day_in_lines"]

[tool.setuptools.package-data]
day_in_lines = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
